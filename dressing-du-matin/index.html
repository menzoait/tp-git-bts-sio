<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Dressing du matin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
:root{
  /* Layout : une colonne façon appli de mode (580px max), blanche, sans décor. « Aujourd’hui » s’ouvre sur le studio : le mannequin en pied sur fond gris clair, la marque en haut, le look en légende. Dessous, les pièces en fiches produit, l’avis du styliste, le bouton d’action, puis la journée et les tendances, séparées par des filets. Un seul thème, clair. */
  color-scheme:light;
  --paper:#FFFFFF;
  --studio:#EFEEEA;
  --tile:#EDECE8;
  --tile-ink:rgba(32,28,22,.42);
  --ink:#151515;
  --ink-2:#55544F;
  --ink-3:#9A9893;
  --rule:#E3E1DC;
  --rule-2:#CFCDC7;
  --good:#2F6B4F;
  --warn:#8E5F12;
  --bad:#B3261E;
  --garment-line:rgba(32,28,22,.42);
  --font-display:"Bodoni Moda","Bodoni 72",Didot,"Times New Roman",serif;
  --font-body:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
a{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:20px;height:20px;flex:none;stroke-width:1.4}
.wrap{max-width:580px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(104px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;gap:28px}
.intro{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.intro > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.intro .eyebrow{order:2}
.intro.row{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
.display{margin:0;font-family:var(--font-display);font-weight:500;font-size:34px;line-height:1;letter-spacing:.04em;text-transform:uppercase;font-variation-settings:"opsz" 40}
.display em{font-style:normal}
.h{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:0}
.opt{font-weight:400;letter-spacing:.04em;color:var(--ink-3);margin-left:6px}
.muted{color:var(--ink-3)}
.banner{padding:12px 14px;background:var(--studio);font-size:13.5px;margin:0}
.card{background:none;border:0;border-top:1px solid var(--rule);padding:28px 0 0}
.label-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;line-height:1;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border:1px solid var(--rule-2);color:var(--ink);white-space:nowrap}
.label-tag .i{width:12px;height:12px}
.label-tag.quiet{color:var(--ink-3);border-color:var(--rule)}
.label-tag.hot{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* Le studio : le mannequin en pied sur fond gris clair */
.cover{--iss:var(--studio);position:relative;isolation:isolate;overflow:hidden;color:var(--ink);background:linear-gradient(180deg,#F4F3F0 0%,var(--studio) 58%,#E6E4DF 100%);height:clamp(560px,80vh,760px);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));margin-top:calc(-18px - env(safe-area-inset-top,0px))}
.cover.sm{height:clamp(540px,72vh,680px)}
.cover::before{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.035))}
.cover-meta{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 52px);left:18px;right:18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.masthead{position:absolute;z-index:4;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 18px);margin:0;padding-left:.32em;text-align:center;font-family:var(--font-display);font-weight:500;font-size:22px;line-height:1;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);font-variation-settings:"opsz" 30;white-space:nowrap;pointer-events:none;user-select:none;-webkit-user-select:none}
.masthead .ml{display:inline-block;animation:mast-in .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 35ms + 80ms)}
.masthead.shown .ml{animation:none}
@keyframes mast-in{from{opacity:0;transform:translateY(4px)}}
.stage-host{position:absolute;inset:0;z-index:2}
.stage-host canvas{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.stage-host canvas:active{cursor:grabbing}
.cover-lines{position:absolute;z-index:5;left:18px;bottom:76px;display:flex;flex-direction:column;gap:4px;max-width:48%;pointer-events:none}
.cl-look{margin:0;display:flex;flex-direction:column;gap:2px}
.cl-n{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.cl-of{font-size:12px;color:var(--ink-2)}
.cl-occ{margin:0;font-size:13px;color:var(--ink-2);line-height:1.35}
.cl-occ em{font-style:normal;display:block;color:var(--ink-2)}
.cl-wx{position:absolute;z-index:5;right:18px;top:calc(env(safe-area-inset-top,0px) + 50px);display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:0;color:var(--ink);text-align:right}
.cl-row{display:flex;align-items:baseline;gap:6px}
.cl-row b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.cl-row small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.cl-ic{display:flex;gap:6px;margin-top:2px;color:var(--ink-2)}
.cl-ic .i{width:16px;height:16px}
.body-lines{gap:2px;bottom:76px}
.body-lines .cl-row b{font-size:20px}
.body-lines .cl-of{margin-top:4px}
.sticker{position:absolute;z-index:5;left:18px;top:calc(env(safe-area-inset-top,0px) + 74px);margin:0;padding:5px 8px;background:var(--ink);color:var(--paper);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
.cover .glass{background:rgba(255,255,255,.72);border:1px solid var(--rule-2);color:var(--ink);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.stage-bottom{position:absolute;left:18px;right:18px;bottom:18px;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pager{display:inline-flex;align-items:center;gap:0;padding:0}
.pg{width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.pg:disabled{opacity:.3}
.pager-n{font-size:12px;font-weight:600;letter-spacing:.08em;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.tools{display:inline-flex;align-items:center;gap:6px}
.viewseg{display:inline-flex;padding:0;gap:0}
.viewseg button{min-height:40px;padding:0 12px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.viewseg button[aria-checked="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.round{width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.round[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.drag-hint{display:none}
.flat-host{position:absolute;top:calc(env(safe-area-inset-top,0px) + 104px);bottom:136px;left:30px;right:30px;z-index:2;display:flex;align-items:center;justify-content:center}
.cover.is-flat .cl-occ{display:block}
.flat-host .board{height:100%;width:auto;max-width:100%;padding:10px;background:none;border:0}
.stage-msg{position:absolute;inset:0;z-index:7;display:grid;place-items:center;padding:30px}
.stage-msg .box{max-width:320px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 22px;text-align:center}
.cover .stage-msg .box.glass{background:rgba(255,255,255,.9)}
.stage-msg .box p{margin:0}
.stage-msg .big{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.1;letter-spacing:.06em;text-transform:uppercase}
.stage-msg .row{display:flex;gap:8px}
.stage-msg .muted{font-size:12.5px;color:var(--ink-3)}
@media (min-width:600px){.cover{margin-inline:0;margin-top:0}}

/* Le look : les pièces en fiches produit */
.card.look-panel{display:flex;flex-direction:column;gap:22px;padding:0;border:0}
.lp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rail{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pc{--garment-line:var(--tile-ink);position:relative;flex:0 0 142px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;padding:0;text-align:left;min-width:0;color:var(--ink)}
.pc-vis{position:relative;display:block;width:100%;aspect-ratio:3/4;max-width:100%;background:var(--tile)}
.pc-vis > img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pc-vis > img.ph.cutout{inset:12%;width:76%;height:76%}
.pc-vis > img.ph.flat{object-fit:cover}
.pc-vis .sw-ic{position:absolute;top:6px;right:6px;width:26px;height:26px;display:grid;place-items:center;background:var(--paper);color:var(--ink);padding:0}
.pc-vis .sw-ic .i{width:14px;height:14px}
.pc-slot{order:2;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pc-name{order:1;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.quote{margin:0;font-size:15px;line-height:1.6;color:var(--ink-2);text-wrap:pretty}
.look-actions{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.look-actions .btn.primary{flex:1 1 160px}
.rate{display:flex;gap:6px}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;background:var(--studio);font-size:13.5px}
.note p{margin:0;flex:1 1 220px;min-width:0}
.ai-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.ai-status > span:not(.label-tag){flex:1 1 160px;min-width:0}
.stitching{flex-basis:100%;height:1px;background:linear-gradient(90deg,var(--ink) 0 30%,transparent 30%);background-size:200% 1px;animation:load 1.2s linear infinite}
@keyframes load{from{background-position:100% 0}to{background-position:-100% 0}}

/* La journée */
.day{display:flex;flex-direction:column;gap:22px;scroll-margin-top:12px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.day-t{margin:0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.temps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.temp{display:flex;flex-direction:column;gap:6px;min-width:0}
.temp-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:4px;border:1px solid var(--rule-2);padding:3px}
.step{width:40px;height:40px;font-size:20px;line-height:1;color:var(--ink);flex:none}
.step:active{background:var(--studio)}
.deg{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1}
.deg small{font-size:12px;color:var(--ink-3);margin-left:2px}
.wx-toggles{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:7px;padding:0 14px;min-height:38px;border:1px solid var(--rule-2);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.toggle .i{width:15px;height:15px}
.toggle[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.advice{margin:0;font-size:13.5px;color:var(--ink-2)}
.group{display:flex;flex-direction:column;gap:10px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:0 14px;min-height:38px;border:1px solid var(--rule-2);background:var(--paper);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--ink);transition:background .15s,color .15s,border-color .15s}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .n{font-weight:500;opacity:.6;margin-left:6px;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap;transition:opacity .15s}
.btn:active:not(:disabled){opacity:.8}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4}
.btn.big{min-height:52px}
.btn.wide{width:100%}
.btn.ghost{background:var(--paper);border-color:var(--ink);color:var(--ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:11px}
.btn.danger{background:var(--bad);color:#fff}
.danger-t{color:var(--bad)!important;border-color:var(--bad)!important}
.btn-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.icon-btn{width:48px;height:48px;display:inline-grid;place-items:center;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);flex:none}
.icon-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.icon-btn[aria-pressed="true"] .fillable{fill:currentColor}
.imposed-card{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--rule)}
.imposed-card .grow{flex:1;min-width:0;font-size:12px;letter-spacing:.05em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:44px;height:58px;flex:none;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.thumb > *{max-width:100%;max-height:100%}

/* Vue à plat */
.board{position:relative;display:grid;grid-template-columns:1fr 1.25fr .72fr;grid-template-rows:1fr 1fr .85fr;gap:6px;padding:14px;aspect-ratio:1/1.02;width:100%;max-width:100%;background:var(--tile)}
.board.mini{padding:6px;gap:2px}
.cell{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.cell > *{max-width:100%;max-height:100%}
.ph{display:block;max-width:100%;max-height:100%;object-fit:contain}
.ph.cutout{filter:drop-shadow(0 8px 10px rgba(0,0,0,.16))}
.ph.flat{width:100%;height:100%;object-fit:cover}
.garment{display:block;width:100%;height:100%;object-fit:contain}

/* Garde-robe : un catalogue */
.ward-filters{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;border-bottom:1px solid var(--rule)}
.ward-filters::-webkit-scrollbar{display:none}
.wf{flex:none;padding:8px 0 10px;margin-bottom:-1px;font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.wf[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 8px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.icard{position:relative;display:flex;flex-direction:column;gap:9px;padding:0;text-align:left;min-width:0}
.ic-vis{--garment-line:var(--tile-ink);position:relative;display:block;width:100%;aspect-ratio:3/4;max-width:100%;background:var(--tile);overflow:hidden;transition:opacity .15s}
.ic-vis > img{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
.ic-vis > img.ph.cutout{inset:12%;width:76%;height:76%}
.ic-vis > img.ph.flat{object-fit:cover}
.icard:active .ic-vis{opacity:.85}
.icard.is-sale .ic-vis{opacity:.45}
.ic-cap{display:flex;flex-direction:column;gap:7px;min-width:0}
.ic-name{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-meta{display:flex;align-items:center;gap:10px;min-width:0}
.sq{display:inline-flex;gap:4px}
.sq i{width:9px;height:9px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.ic-flag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.cdots{display:inline-flex;flex:none;gap:3px}
.cdot{width:9px;height:9px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.badge{font-size:10.5px;font-weight:600;line-height:1;padding:5px 7px;background:var(--ink);color:var(--paper);letter-spacing:.08em;text-transform:uppercase}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:22px 0;color:var(--ink-2);border-top:1px solid var(--rule)}
.empty p{margin:0;max-width:44ch}

/* Historique */
.hist{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.hcard{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:18px 0;border-bottom:1px solid var(--rule)}
.hdate{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-top:2px}
.hdate .d{font-family:var(--font-display);font-size:30px;line-height:.9;font-weight:500;font-variant-numeric:lining-nums}
.hdate .m{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.hc-main{min-width:0;display:flex;flex-direction:column;gap:10px}
.hc-day{margin:0;font-size:13.5px;line-height:1.4}
.hc-st{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.hc-ctx{color:var(--ink-2)}
.hc-pieces{display:flex;gap:6px;flex-wrap:wrap}
.hc-pc{--garment-line:var(--tile-ink);position:relative;width:52px;aspect-ratio:3/4;background:var(--tile);overflow:hidden}
.hc-pc > img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.hc-pc > img.ph.cutout{inset:10%;width:80%;height:80%}
.hc-pc > img.ph.flat{object-fit:cover}
.hc-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hc-actions .icon-btn{width:38px;height:38px}
.hc-actions .icon-btn .i{width:17px;height:17px}

/* Silhouette */
.bform{display:flex;flex-direction:column;gap:24px}
.sl{display:flex;flex-direction:column;gap:6px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sl-top label{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.sl-top output{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.sl input[type="range"]{width:100%;height:28px;accent-color:var(--ink)}
.sl-ends{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fine{border-top:1px solid var(--rule);padding-top:16px}

.tr-mine::-webkit-scrollbar{display:none}

.tr-have{position:absolute;top:5px;right:5px;width:17px;height:17px;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-size:10px;font-weight:700;line-height:1}
.tr-more summary{font-size:11.5px}
.tr-more[open]{display:flex;flex-direction:column;gap:14px}
.tr-more[open] summary{margin-bottom:0}
.tr-colors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}
.tr-col{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);min-width:0;text-align:left}
.tr-col .dot{width:100%;height:56px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.chip.static{cursor:default}
.chip.own{border-color:var(--good);color:var(--good);background:transparent}
.chip.own::before{content:"✓ "}
.tr-tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.tr-tips li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.tr-tips li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:1px;background:var(--ink)}
.tr-foot{margin:0;font-size:11.5px;color:var(--ink-3);overflow-wrap:anywhere}

.ref-box{display:flex;flex-direction:column;gap:12px}
.ref-result{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;padding:12px 0;border-top:1px solid var(--rule)}
.ref-vis{position:relative;aspect-ratio:3/4;max-width:100%;background:var(--tile)}
.ref-vis > img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ref-text{display:flex;flex-direction:column;gap:6px;min-width:0}
.ref-name{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.ref-q{margin:4px 0 0;font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.ok{margin:0;font-size:13px;color:var(--good)}
@media (max-width:360px){.hcard{grid-template-columns:38px 1fr}.viewseg button{padding:0 9px}.ref-result{grid-template-columns:80px 1fr}.tr-colors{grid-template-columns:repeat(3,minmax(0,1fr))}.pc{flex-basis:128px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

const refPrompt = (q) => `Tu es styliste. Identifie un vêtement à partir de sa marque et de sa référence, d'après tes connaissances (tu n'as pas accès à internet).

async function identifyRef() {
  const d = S.draft;

  const q = d.refQ;
  if (!q.brand.trim() && !q.ref.trim()) { toast("Indique au moins la marque ou la référence."); return; }
  if (d.aiCtl) d.aiCtl.abort();
  const ctl = new AbortController();
  d.aiCtl = ctl;
  d.refState = "working"; d.refRes = null; d.refConfirmed = false;
  renderSheet();
  try {
    const r = await S.caps.sample.json(refPrompt(q), {signal: ctl.signal, effort: "low"});
    if (S.draft !== d || d.aiCtl !== ctl) return;
    if (!r || r.found === false || !CAT[r.cat]) {
      d.refState = "notfound";
      d.refErr = r && typeof r.note === "string" && r.note.trim() ? `Le styliste ne reconnaît pas cette pièce : ${r.note.trim().slice(0, 200)}` : "Le styliste ne reconnaît pas cette pièce. Ajoute une précision (couleur, coupe) ou passe par une photo.";
    } else {
      const subs = CAT[r.cat].subs, s = String(r.sub || "").toLowerCase().trim();
      const sub = subs.find((x) => x === s) || subs.find((x) => s.includes(x) || x.includes(s)) || subs[0];
      const colors = (Array.isArray(r.colors) ? r.colors : []).map(String).filter((k) => COL[k]).slice(0, 3);
      d.refRes = {
        name: String(r.name || "").trim().slice(0, 60) || defaultName({sub, colors}), cat: r.cat, sub, colors: colors.length ? colors : ["gris"],
        material: String(r.material || "").trim().slice(0, 40), styles: (Array.isArray(r.styles) ? r.styles : []).map(String).filter((k) => STY[k]).slice(0, 4),
        warmth: [1, 2, 3].includes(Number(r.warmth)) ? Number(r.warmth) : 2, rainOk: r.rainOk === true,
        confidence: ["haute", "moyenne", "faible"].includes(r.confidence) ? r.confidence : "moyenne", note: String(r.note || "").trim().slice(0, 200),
      };
      d.refState = "done";
    }
  } catch (e) {
    if (e && e.code === "cancelled") return;
    if (S.draft !== d) return;
    d.refState = "error";
    d.refErr = (e && AI_ITEM_ERR[e.code]) || "Identification impossible cette fois : remplis la fiche toi-même ou passe par une photo.";
  }
  if (S.draft === d) renderSheet();
}

        ctx.drawImage(img, 0, 0, w, h);

const ANALYZE_PROMPT = `Tu es styliste et tu catalogues une garde-robe. La photo montre UN vêtement ou accessoire (posé à plat, sur cintre ou porté).
Réponds uniquement avec un objet JSON de cette forme :
{"name":"Jean droit bleu brut","cat":"bas","sub":"jean","colors":["denim"],"material":"denim","brand":null,"styles":["casual","streetwear"],"warmth":2,"rainOk":false}
Règles :

- colors : 1 ou 2 couleurs dominantes, la principale d'abord, UNIQUEMENT parmi : ${COLORS.map((c) => c.key).join(", ")}. « denim » = jean bleu ; « imprime » = motif marqué (fleurs, carreaux ou rayures voyantes).

const AI_ITEM_ERR = {
  not_granted: "Accès à Claude refusé : remplis la fiche toi-même.",
  rate_limited: "Limite d’utilisation de Claude atteinte : remplis la fiche toi-même ou réessaie plus tard.",
  image_rejected: "Photo refusée par l’analyse (format ou taille) : remplis la fiche toi-même.",

function applyAi(d, r) {

  const subs = CAT[it.cat].subs;
  if (!t.has("sub") && typeof r.sub === "string") {
    const s = r.sub.toLowerCase().trim();
    const m = subs.find((x) => x === s) || subs.find((x) => s.includes(x) || x.includes(s));
    if (m) it.sub = m;
  }
  if (!subs.includes(it.sub)) it.sub = subs[0];

  d.aiCtl = ctl;

- found : false s’il n’y a pas de vêtement ou d’accessoire identifiable sur la capture.
- bbox : rectangle de la PHOTO PRINCIPALE du produit (le vêtement lui-même, pas le texte, les boutons ni les vignettes), en fractions de la largeur et de la hauteur de l’image : [gauche, haut, droite, bas], valeurs entre 0 et 1. Serre au plus près du vêtement.
- brand et ref : recopie seulement ce qui est écrit sur la capture (nom de la marque, nom du modèle ou référence, code couleur). Sinon null. N’invente rien.
- name : nom court en français (2 à 5 mots), sans la marque.
- cat et sub : choisis UNIQUEMENT dans cette liste (cat : sub possibles) :
${CATS.map((c) => `  ${c.key} : ${c.subs.join(", ")}`).join("\n")}
- colors : 1 ou 2 couleurs du vêtement montré, la principale d’abord, UNIQUEMENT parmi : ${COLORS.map((c) => c.key).join(", ")}. Si la page indique la couleur choisie, suis-la.
- material : composition écrite sur la page si elle est visible (ex. « coton », « laine mélangée »), sinon la matière probable en un ou deux mots.
- styles : 1 à 4 styles UNIQUEMENT parmi : ${STYLES.map((s) => s.key).join(", ")}.
- warmth : 1 = léger, 2 = moyen, 3 = chaud.
- rainOk : true seulement si la pièce supporte la pluie, false sinon.`;
async function readCapture(full) {
  const d = S.draft;
  if (!d || !d.photo) return;
  if (d.aiCtl) d.aiCtl.abort();
  const ctl = new AbortController();
  d.aiCtl = ctl;
  d.ai = "capture";
  d.aiSrc = "capture";
  updateAiLine();
  const fail = (msg) => {
    if (S.draft !== d || !d.photo) return;
    d.photo.reading = false;
    d.photo.showCrop = true;
    if (!d.photo.cropSet) { d.photo.crop = {l: 0.06, t: 0.1, r: 0.94, b: 0.62}; setCapture(d); }
    d.ai = "error";
    d.aiErr = msg;
    renderSheet();
  };
  try {
    const blob = await canvasBlob(shrink(full, 1400), "image/jpeg", 0.88);
    const r = await S.caps.sample.json(CAPTURE_PROMPT, {images: [blob], signal: ctl.signal, effort: "low"});
    if (S.draft !== d || d.aiCtl !== ctl || !d.photo) return;
    if (!r || typeof r !== "object" || r.found === false) { fail("Aucun vêtement repéré sur la capture : recadre toi-même avec les réglages, ou passe par une photo."); return; }
    const box = validBox(r.bbox);
    if (box) { d.photo.crop = box; d.photo.cropSet = true; setCapture(d); }
    applyAi(d, {...r, brand: null});
    const info = [];
    if (typeof r.brand === "string" && r.brand.trim()) { if (!d.touched.has("brand")) d.it.brand = r.brand.trim().slice(0, 40); info.push(r.brand.trim()); }
    if (typeof r.ref === "string" && r.ref.trim()) { if (!d.touched.has("ref")) d.it.ref = r.ref.trim().slice(0, 60); info.push(r.ref.trim()); }
    d.photo.reading = false;
    if (!box) { d.photo.showCrop = true; d.photo.crop = {l: 0.06, t: 0.1, r: 0.94, b: 0.62}; setCapture(d); }
    d.ai = "capdone";
    d.aiInfo = info.join(" · ").slice(0, 80);
    renderSheet();
  } catch (e) {
    if (e && e.code === "cancelled") return;
    fail((e && AI_ITEM_ERR[e.code]) || "Lecture de la capture impossible cette fois : recadre toi-même et remplis la fiche.");
  }
}

/* --- Styliste IA : lecture d’une étiquette (rien n’est conservé) --- */
const LABEL_PROMPT = `La photo montre l’étiquette d’un vêtement (étiquette de marque, de composition ou étiquette prix).
Réponds uniquement avec un objet JSON : {"brand":"Levi's","ref":"501 Original","material":"coton"}
- brand : la marque écrite sur l’étiquette, sinon null.
- ref : nom du modèle, référence ou code article s’il est écrit, sinon null.
- material : la matière principale en un ou deux mots d’après la composition (ex. « 100 % coton » donne « coton », « 70 % laine 30 % polyamide » donne « laine mélangée »), sinon null.
Recopie ce qui est lisible, n’invente rien.`;
async function readLabel(file) {
  const d = S.draft;
  if (!d) return;
  if (!S.caps.sample || S.settings.ai === false) { toast("La lecture d’étiquette passe par le styliste IA : active-le dans les réglages."); return; }
  const ctl = new AbortController();
  d.labelCtl = ctl;
  const prevAi = d.ai, prevSrc = d.aiSrc;
  d.ai = "label";
  d.aiSrc = "label";
  updateAiLine();
  try {
    const cv = await loadImageToCanvas(file, 1400);
    const blob = await canvasBlob(cv, "image/jpeg", 0.88);
    const r = await S.caps.sample.json(LABEL_PROMPT, {images: [blob], modelTier: "quick", signal: ctl.signal});
    if (S.draft !== d || d.labelCtl !== ctl) return;
    const got = [];
    const take = (k, max) => { const v = r && typeof r[k] === "string" ? r[k].trim() : ""; if (!v) return; d.it[k] = v.slice(0, max); d.touched.add(k); got.push(v); };
    take("brand", 40); take("ref", 60); take("material", 40);
    if (!got.length) { d.ai = ["label", "labeldone"].includes(prevAi) ? "idle" : prevAi; d.aiSrc = prevSrc; renderSheet(); toast("Rien de lisible sur l’étiquette : rapproche-toi et évite les reflets."); return; }
    d.ai = "labeldone";
    d.aiInfo = got.join(" · ").slice(0, 90);
    renderSheet();
  } catch (e) {
    if (e && e.code === "cancelled") return;
    if (S.draft !== d) return;
    d.ai = "error";
    d.aiErr = (e && AI_ITEM_ERR[e.code]) || "Lecture de l’étiquette impossible cette fois : remplis les champs toi-même.";
    renderSheet();
  }
}

/* --- Enregistrement d’un vêtement --- */
const DB_ERR = {
  quota_exceeded: "Stockage plein : supprime des pièces ou des tenues anciennes.",
  invalid_argument: "Enregistrement refusé : seul le propriétaire de l’appli peut la modifier.",
  revoked: "Accès à l’appli retiré : recharge la page.",
  resource_exhausted: "Trop d’enregistrements d’un coup : patiente quelques secondes.",
};
function dbErr(e) { toast((e && DB_ERR[e.code]) || "Enregistrement impossible pour l’instant : réessaie dans un instant."); }
async function saveItem() {
  const d = S.draft;
  const db = S.caps.db;
  if (!d || d.saving) return;
  if (!db) { toast("Ouvre l’appli dans Claude, connecté à ton compte, pour enregistrer ta garde-robe."); return; }
  const it = d.it;
  if (!it.name.trim()) it.name = defaultName(it);
  if (!it.colors.length) it.colors = ["gris"];
  d.saving = true;
  renderSheet();
  let photo = it.photo || null, cutout = !!it.cutout, uploaded = null;
  try {
    if (d.photo) {
      if (!S.caps.assets) throw {code: "no_assets"};
      const useCut = !!(d.photo.useCut && d.photo.cut);
      const cv = shrink(useCut ? d.photo.cut : d.photo.src, 720);
      const blob = await canvasBlob(cv, useCut ? "image/png" : "image/jpeg", 0.86);
      const res = await S.caps.assets.upload(blob, {type: useCut ? "image/png" : "image/jpeg"});
      uploaded = res.id;
      photo = res.id;
      cutout = useCut;
    }
    const body = {
      name: it.name.trim().slice(0, 60), cat: it.cat, sub: it.sub, colors: it.colors.slice(0, 3), material: (it.material || "").trim(), brand: (it.brand || "").trim(), ref: (it.ref || "").trim(),
      styles: it.styles.slice(0, 6), warmth: Number(it.warmth) || 2, rainOk: !!it.rainOk, status: it.status === "sale" ? "sale" : "ok", fav: !!it.fav,
      photo, cutout, example: d.photo ? false : !!it.example, lastWorn: it.lastWorn || null, createdAt: it.createdAt || new Date().toISOString(),
    };
    const ref = d.id ? db.doc("items/" + d.id) : db.collection("items").doc();
    await ref.set(body);
    const old = d.id && S.items.get(d.id);
    if (uploaded && old && old.photo && old.photo !== uploaded && S.caps.assets) S.caps.assets.delete(old.photo).catch(() => {});
    const wasNew = !d.id;
    closeSheet();
    toast(wasNew ? `${body.name} ajouté à ta garde-robe.` : "Fiche mise à jour.");
  } catch (e) {
    if (uploaded && S.caps.assets) S.caps.assets.delete(uploaded).catch(() => {});
    if (S.draft === d) { d.saving = false; renderSheet(); }
    if (e && e.code === "no_assets") toast("Les photos ne peuvent pas être enregistrées ici : ouvre l’appli dans Claude.");
    else if (e && e.code === "quota_or_state") toast("Espace photo plein : supprime d’anciennes pièces.");
    else if (e && e.code === "too_large") toast("Photo trop lourde : choisis une image plus petite.");
    else dbErr(e);
  }
}
async function deleteItem() {
  const d = S.draft, db = S.caps.db;
  if (!d || !d.id || !db) return;
  const it = S.items.get(d.id);
  try {
    await db.doc("items/" + d.id).delete();
    if (it && it.photo && S.caps.assets) S.caps.assets.delete(it.photo).catch(() => {});
    if (S.imposed === d.id) S.imposed = null;
    closeSheet();
    toast("Vêtement supprimé.");
  } catch (e) { dbErr(e); }
}

/* --- Remplacer une pièce / choisir la pièce imposée --- */
function swapSheetHtml() {
  const {i, slot} = S.swap;
  const L = S.looks[i];
  const isAcc = slot.startsWith("acc");
  const key = isAcc ? "acc" : slot;
  const cur = isAcc ? (L.acc[Number(slot.slice(3))] || {}).it : L[slot] && L[slot].it;
  const used = new Set(lookIds(L));
  const pool = ((S.pools && S.pools[key]) || []).filter((p) => !used.has(p.it.id));
  return `${sheetHead(`Remplacer : ${esc(SLOT_LABEL[key].toLowerCase())}`)}
  <div class="sheet-body">
    ${cur ? `<p class="hint">Actuellement : ${esc(cur.name)}. Les pièces sont triées de la plus adaptée à la moins adaptée.</p>` : ""}
    ${pool.length ? `<div class="pick-list">${pool.map((p) => itemCard(p.it, "swap-pick")).join("")}</div>` : `<p class="hint">Aucune autre pièce de ta garde-robe ne convient ici (style, occasion ou météo).</p>`}
    ${isAcc ? `<button class="btn ghost" data-action="swap-remove">Retirer cet accessoire</button>` : ""}
  </div>`;
}
function imposedSheetHtml() {
  const all = [...S.items.values()].filter((it) => it.status !== "sale");
  const groups = CATS.map((c) => ({c, list: all.filter((it) => it.cat === c.key).sort((a, b) => String(a.name).localeCompare(String(b.name), "fr"))})).filter((g) => g.list.length);
  return `${sheetHead("Pièce imposée")}
  <div class="sheet-body">
    <p class="hint">Choisis la pièce que tu veux absolument porter : les tenues se construisent autour.</p>
    ${groups.length ? groups.map((g) => `<div class="pick-group"><h3 class="h">${esc(g.c.label)}</h3><div class="pick-list">${g.list.map((it) => itemCard(it, "imposed-pick")).join("")}</div></div>`).join("") : `<p class="hint">Aucune pièce disponible pour l’instant.</p>`}
  </div>`;
}
function applySwap(id) {
  const {i, slot} = S.swap;
  const L = S.looks[i];
  if (!L) return;
  const isAcc = slot.startsWith("acc");
  const key = isAcc ? "acc" : slot;
  if (isAcc) {
    const k = Number(slot.slice(3));
    if (id) { const c = S.pools.acc.find((p) => p.it.id === id); if (c) L.acc[k] = c; } else L.acc.splice(k, 1);
  } else {
    const c = S.pools[key].find((p) => p.it.id === id);
    if (c) L[slot] = c;
  }
  L.why = explainRules(L, S.ctx);
  L.ai = false; L.touched = true; L.docId = null; L.worn = false; L.rating = 0; L.fav = false;
  closeSheet();
  renderLook(false);
}

/* ---------------- Actions sur les tenues ---------------- */
function outfitBody(L) {
  return {date: today(), at: new Date().toISOString(), items: lookIds(L), occasion: S.sel ? S.sel.occ : S.occ, style: S.sel ? S.sel.style : S.sty,
    weather: S.ctx ? {am: S.ctx.am, pm: S.ctx.pm, rain: S.ctx.rain, wind: S.ctx.wind} : null, why: L.why || "", source: L.ai ? "ia" : "regles",
    rating: L.rating || 0, fav: !!L.fav, worn: !!L.worn};
}
async function markWorn(ids) {
  const db = S.caps.db, t = today();
  for (const id of ids) if (S.items.has(id)) await db.doc("items/" + id).update({lastWorn: t});
}
async function wear(i) {
  const L = S.looks[i];
  const db = S.caps.db;
  if (!L || L.worn) return;
  if (!db) { toast("Ouvre l’appli dans Claude pour garder ton historique."); return; }
  L.worn = true; L.touched = true;
  renderLookPanel();
  try {
    const body = outfitBody(L);
    if (L.docId) await db.doc("outfits/" + L.docId).set(body);
    else { const ref = db.collection("outfits").doc(); L.docId = ref.id; await ref.set(body); }
    await markWorn(body.items);
    toast("Bonne journée ! Tenue ajoutée à l’historique.");
  } catch (e) { L.worn = false; renderLookPanel(); dbErr(e); }
}
async function persistLook(L) {
  const db = S.caps.db;
  if (!db) return;
  try {
    if (L.docId) await db.doc("outfits/" + L.docId).update({rating: L.rating || 0, fav: !!L.fav});
    else if (L.rating || L.fav) { const ref = db.collection("outfits").doc(); L.docId = ref.id; await ref.set(outfitBody(L)); }
  } catch (e) { dbErr(e); }
}

/* ---------------- Données : abonnement et écritures ---------------- */
let wTimer = null;
function onWeatherEdit() {
  S.wEdited = true;
  S.wLabel = "saisie ce matin";
  renderWeather();
  scheduleRefresh();
  clearTimeout(wTimer);
  wTimer = setTimeout(saveWeather, 800);
}
async function saveWeather() {
  const db = S.caps.db;
  if (!db) return;
  const t = today();
  try { await db.doc("weather/" + t).set({date: t, am: S.W.am, pm: S.W.pm, rain: !!S.W.rain, wind: !!S.W.wind, source: "manuel", at: new Date().toISOString()}); } catch (e) { dbErr(e); }
}
function applyWeatherDoc(snap) {
  S.lastWDoc = snap || null;
  const t = today();
  const w = snap && snap.exists ? snap.data() : null;
  if (!w || typeof w.am !== "number" || typeof w.pm !== "number" || !w.date) return;
  const age = daysBetween(w.date, t);
  if (age === 0) {
    if (S.wEdited && w.source !== "auto") return;
    S.W = {am: w.am, pm: w.pm, rain: !!w.rain, wind: !!w.wind};
    S.wLabel = w.source === "auto" ? `automatique${w.city ? " · " + w.city : ""}` : "saisie ce matin";
  } else if (age > 0 && age <= 3 && !S.wEdited) {
    S.W = {am: w.am, pm: w.pm, rain: false, wind: false};
    S.wLabel = age === 1 ? "valeurs d’hier, à ajuster" : "valeurs récentes, à ajuster";
  } else return;
  renderWeather();
  scheduleRefresh();
}
async function saveSettings(patch) {
  S.settings = {...S.settings, ...patch};
  renderSettings();
  renderWeather();
  const db = S.caps.db;
  if (!db) return;
  try { await db.doc("settings/main").set({cold: S.settings.cold, ai: S.settings.ai !== false, city: S.settings.city || "", trends: S.settings.trends !== false, missing: !!S.settings.missing}); } catch (e) { dbErr(e); }
}
async function bulk(fn, done) {
  S.busyBulk = true;
  renderWardrobe();
  try { await fn(); if (done) toast(done); } catch (e) { dbErr(e); } finally { S.busyBulk = false; S.confirmEx = false; renderWardrobe(); }
}
async function exportData() {
  const dl = S.caps.downloads;
  if (!dl) { toast("L’export n’est pas disponible dans cette vue."); return; }
  const data = {app: "Dressing du matin", exportedAt: new Date().toISOString(), items: [...S.items.values()], outfits: S.outfits, settings: S.settings};
  try { await dl.save({filename: `garde-robe-${today()}.json`, data: JSON.stringify(data, null, 2)}); toast("Export enregistré."); }
  catch (e) { if (!e || e.code !== "declined") toast("Export impossible pour l’instant."); }
}
async function deleteAll() {
  const db = S.caps.db;
  if (!db) return;
  S.deleting = true;
  renderSettings();
  try {
    for (const it of [...S.items.values()]) {
      await db.doc("items/" + it.id).delete();
      if (it.photo && S.caps.assets) await S.caps.assets.delete(it.photo).catch(() => {});
    }
    for (const o of S.outfits.slice()) await db.doc("outfits/" + o.id).delete();
    const ws = await db.collection("weather").get();
    for (const w of ws.docs) await db.doc("weather/" + w.id).delete();
    await db.doc("settings/main").delete();
    S.imposed = null;
    toast("Toutes tes données ont été supprimées.");
  } catch (e) { dbErr(e); } finally { S.deleting = false; S.confirmAll = false; renderSettings(); }
}
function onDbError(e) { if (e && e.code === "revoked") setBanner("L’accès à cette appli a été retiré : recharge la page."); }
function setBanner(text) { const b = $("#banner"); b.textContent = text || ""; b.hidden = !text; }
function subscribe() {
  const db = S.caps.db;
  db.collection("items").onSnapshot((snap) => {
    const first = !S.ready.items;
    S.items = new Map(snap.docs.map((d) => [d.id, {...d.data(), id: d.id}]));
    S.ready.items = true;
    renderWardrobe();
    renderImposed();
    renderTrends();
    if (S.outfits.length || first) renderHistory();
    if (first || !S.looks.length || S.looks.some((L) => mainParts(L).some((p) => !S.items.has(p.it.id)))) refreshLooks();
  }, onDbError);
  db.collection("outfits").orderBy("at", "desc").limit(300).onSnapshot((snap) => {
    S.outfits = snap.docs.map((d) => ({...d.data(), id: d.id}));
    renderHistory();
  }, onDbError);
  db.doc("settings/main").onSnapshot((snap) => {
    if (snap.exists) { const val = snap.data(); S.settings = {cold: val.cold || "normal", ai: val.ai !== false, city: val.city || "", trends: val.trends !== false, missing: !!val.missing}; }
    renderSettings();
    renderWeather();
    renderTrends();
  }, onDbError);
  db.doc("trends/current").onSnapshot((snap) => {
    S.trends = snap.exists ? sanitizeTrends(snap.data()) : null;
    renderTrends();
    renderLookPanel();
  }, onDbError);
  db.collection("weather").orderBy("date", "desc").limit(1).onSnapshot((snap) => applyWeatherDoc(snap.docs[0]), onDbError);
}

const PHOTO_URLS = new Map();
function photoSrc(id) { return PHOTO_URLS.get(id) || (S.local ? "data:," : "/_blob/" + encodeURIComponent(id)); }
function localDb() {
  const KEY = "dm:data:v1";
  let data = null, persist = true;
  try { const raw = localStorage.getItem(KEY); data = raw ? JSON.parse(raw) : null; } catch (e) { persist = false; data = null; }
  if (!data || typeof data !== "object") {
    data = {};
    const at = new Date().toISOString();
    for (const e of EXAMPLES) { const {id, ...rest} = e; data["items/" + id] = {...rest, brand: "", ref: "", status: "ok", fav: false, photo: null, cutout: false, example: true, lastWorn: null, createdAt: at}; }
  }
  const cur = data["trends/current"];
  if (!cur || String(cur.updatedAt || "") < TRENDS_DEFAULT.updatedAt) data["trends/current"] = TRENDS_DEFAULT;
  const save = () => { if (!persist) return; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { throw {code: "quota_exceeded"}; } };
  try { save(); } catch (e) { persist = false; }
  const listeners = new Set();
  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const snapDoc = (path) => ({id: path.split("/").pop(), exists: path in data, data: () => clone(data[path])});
  let pending = false;
  const fire = () => { if (pending) return; pending = true; setTimeout(() => { pending = false; for (const l of [...listeners]) { try { l(); } catch (e) { /* un écran en erreur ne bloque pas les autres */ } } }, 0); };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const write = (path, next) => { const had = path in data, prev = data[path]; if (next === undefined) delete data[path]; else data[path] = next; try { save(); } catch (e) { if (had) data[path] = prev; else delete data[path]; throw e; } fire(); };
  function query(coll, ord, lim) {
    const snapQ = () => {
      const depth = coll.split("/").length + 1;
      let docs = Object.keys(data).filter((k) => k.startsWith(coll + "/") && k.split("/").length === depth).map(snapDoc);
      if (ord) docs.sort((a, b) => { const x = a.data()[ord[0]], y = b.data()[ord[0]]; return (x > y ? 1 : x < y ? -1 : 0) * (ord[1] === "desc" ? -1 : 1); });
      if (lim) docs = docs.slice(0, lim);
      return {docs, size: docs.length, empty: !docs.length};
    };
    return {
      orderBy: (f, dir) => query(coll, [f, dir || "asc"], lim),
      limit: (n) => query(coll, ord, n),
      get: async () => snapQ(),
      onSnapshot(next) { const l = () => next(snapQ()); listeners.add(l); setTimeout(l, 0); return () => listeners.delete(l); },
      doc: (id) => docRef(coll + "/" + (id || newId())),
    };
  }
  function docRef(path) {
    return {
      id: path.split("/").pop(), path,
      get: async () => snapDoc(path),
      set: async (v) => write(path, clone(v)),
      update: async (v) => { if (!(path in data)) throw {code: "not_found"}; write(path, {...data[path], ...clone(v)}); },
      delete: async () => write(path, undefined),
      onSnapshot(next) { const l = () => next(snapDoc(path)); listeners.add(l); setTimeout(l, 0); return () => listeners.delete(l); },
    };
  }
  window.addEventListener("storage", (e) => { if (e.key !== KEY || !e.newValue) return; try { data = JSON.parse(e.newValue); fire(); } catch (er) { /* donnée illisible : on garde la version en mémoire */ } });
  return {db: {doc: docRef, collection: (c) => query(c)}, persist};
}
async function localAssets() {
  if (!window.indexedDB) return null;
  const idb = await new Promise((res, rej) => { const r = indexedDB.open("dressing-du-matin", 1); r.onupgradeneeded = () => r.result.createObjectStore("photos"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const run = (mode, fn) => new Promise((res, rej) => { const t = idb.transaction("photos", mode); fn(t.objectStore("photos")); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  await run("readonly", (st) => { const c = st.openCursor(); c.onsuccess = () => { const cur = c.result; if (!cur) return; if (cur.value instanceof Blob) PHOTO_URLS.set(String(cur.key), URL.createObjectURL(cur.value)); cur.continue(); }; });
  return {
    async upload(blob) {
      const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      try { await run("readwrite", (st) => st.put(blob, id)); } catch (e) { throw {code: e && e.name === "QuotaExceededError" ? "quota_or_state" : "unavailable"}; }
      PHOTO_URLS.set(id, URL.createObjectURL(blob));
      return {id, url: PHOTO_URLS.get(id)};
    },
    async delete(id) {
      await run("readwrite", (st) => st.delete(id));
      const u = PHOTO_URLS.get(id);
      if (u) URL.revokeObjectURL(u);
      PHOTO_URLS.delete(id);
    },
  };
}
const localDownloads = {
  async save({filename, data}) {
    const blob = data instanceof Blob ? data : new Blob([data], {type: "application/json"});

    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return {status: "saved"};

};
